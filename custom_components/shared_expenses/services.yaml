# The shape of each action's fields. What every field is called, and what it is
# for, lives in the translations — Home Assistant reads the labels from there,
# and hassfest refuses an action whose text is written here instead.
#
# Ids rather than pickers. A project and a member are this integration's own,
# not Home Assistant entities, so no selector knows how to list them — the id is
# in the panel's address bar, and in the members dialog. A picker would be nicer
# and would mean teaching a form what a project is; that is a later day's work,
# not a reason to hold the actions back.

add_expense:
  fields:
    group_id:
      required: true
      example: 01KXHEB4VFFWMAN5CG4BDNNBF9
      selector:
        text:

    title:
      required: true
      example: Courses
      selector:
        text:

    amount:
      required: true
      example: 85.42
      selector:
        number:
          min: 0.01
          step: 0.01
          mode: box

    paid_by_member_id:
      required: true
      example: 01KXHEB4VG7Q2M8XQZ0P3R5T7V
      selector:
        text:

    expense_date:
      required: false
      selector:
        datetime:

    currency:
      required: false
      example: USD
      selector:
        text:

    category_id:
      required: false
      selector:
        text:

    description:
      required: false
      selector:
        text:

settle_up:
  fields:
    group_id:
      required: true
      example: 01KXHEB4VFFWMAN5CG4BDNNBF9
      selector:
        text:

    from_member_id:
      required: true
      example: 01KXHEB4VG7Q2M8XQZ0P3R5T7V
      selector:
        text:

    to_member_id:
      required: true
      example: 01KXHEB4VH9S4N0YR1Q5T7W9X2
      selector:
        text:

    amount:
      required: true
      example: 20.00
      selector:
        number:
          min: 0.01
          step: 0.01
          mode: box

    payment_date:
      required: false
      selector:
        datetime:

    currency:
      required: false
      example: USD
      selector:
        text:

    description:
      required: false
      selector:
        text:
