name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant aiosqlite python-ulid pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check custom_components tests

      - name: Test
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Fail if the committed bundle is stale
        run: |
          bundle=../custom_components/shared_expenses/www/index.js
          if ! git diff --quiet -- "$bundle"; then
            echo "::error::www/index.js is out of date. Run the frontend build and commit the result."
            git diff --stat -- "$bundle"
            exit 1
          fi

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands stays set aside: an integration cannot pass it until its icon
          # is in home-assistant/brands, which cannot happen until the
          # integration exists — so it is answered by the brands pull request
          # opened when publishing to the default store. Drop it here once that
          # PR is merged. (hacsjson and integration_manifest were ignored too
          # while the repo was private, since HACS reads those files over
          # raw.githubusercontent, which served nothing then; public now, they
          # validate for real.)
          ignore: brands
