name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant aiosqlite python-ulid pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check custom_components tests

      - name: Test
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Fail if the committed bundle is stale
        run: |
          bundle=../custom_components/shared_expenses/www/index.js
          if ! git diff --quiet -- "$bundle"; then
            echo "::error::www/index.js is out of date. Run the frontend build and commit the result."
            git diff --stat -- "$bundle"
            exit 1
          fi

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Three checks are set aside, all answered by publishing rather than
          # by building — remove them from this list as each is met.
          #
          # brands: an integration cannot pass it until its icon is in
          # home-assistant/brands, which cannot happen until the integration
          # exists — so it is satisfied by the brands pull request opened as
          # part of publishing to the default store.
          #
          # hacsjson, integration_manifest: HACS reads these two files over
          # raw.githubusercontent.com, which serves nothing for a private
          # repository — so both come back empty and fail while the repo is
          # private, whatever the files hold. They pass the moment it is public.
          # The files are already valid, and hassfest validates the manifest on
          # every push regardless.
          ignore: brands hacsjson integration_manifest
        env:
          # Authenticate HACS's own calls to the GitHub API. Unauthenticated,
          # they draw on the runner IP's shared 60-per-hour allowance, and once
          # it is spent GitHub answers 503 — which HACS reports as "repository
          # not loaded properly", though nothing here is wrong. The workflow's
          # own token lifts the limit and the check reads the repo again.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
