name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant aiosqlite python-ulid pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check custom_components tests

      - name: Test
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: custom_components/shared_expenses/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/shared_expenses/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- ../www/index.js; then
            echo "::error::www/index.js is out of date. Run the frontend build and commit the result."
            git diff --stat -- ../www/index.js
            exit 1
          fi

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
